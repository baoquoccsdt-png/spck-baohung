<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Học Đường 24h</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Học Đường 24h</a>
      <div class="nav-auth" id="authArea"></div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h2>Đăng nhập</h2>

      <div id="alert" class="alert"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" id="username" placeholder="Nhập tên đăng nhập">
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu">
        </div>

        <button type="submit" class="btn btn-primary">Đăng nhập</button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-logo">Học Đường 24h</div>
      <p>Đồ án học tập • LocalStorage chỉ dùng cho mục đích giáo dục</p>
    </div>
  </footer>

  <script src="../js/auth.js"></script>
</body>
</html>
